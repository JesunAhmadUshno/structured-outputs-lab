name: Release artifacts
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source artifact
        run: |
          mkdir -p dist
          tar --exclude=.git --exclude=dist --exclude=__pycache__ -czf "dist/structured-outputs-lab-${GITHUB_REF_NAME}.tar.gz" .
          ls -la dist
      - name: Attach artifact to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
