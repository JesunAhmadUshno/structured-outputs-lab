name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff and the test-only reference validator
        run: python -m pip install ruff jsonschema==4.26.0
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: layout check (required files, abstract, no public grade)
        run: python -m unittest discover -s tests -p "test_layout.py" -v
      - name: level 1 learn tests
        run: python -m unittest discover -s tests -p "test_learn*.py" -v
      - name: level 1 case run
        run: python level-1-learn/run_cases.py
      - name: level 2 build tests
        run: python -m unittest discover -s tests -p "test_build*.py" -v
      - name: level 2 build run
        run: python level-2-build/run_build.py
      - name: level 3 deep tests
        run: python -m unittest discover -s tests -p "test_deep*.py" -v
      - name: level 3 deep healing run
        run: python level-3-deep/run_deep.py
      - name: level 3 supplementary set run
        run: python level-3-deep/run_supplement.py
      - name: level 3 uncertainty report
        run: python level-3-deep/uncertainty.py
      - name: committed results reproduce byte for byte
        run: git diff --exit-code -- level-2-build/results_build.json level-3-deep/results_deep.json level-3-deep/results_supplement.json level-3-deep/uncertainty.json
